name: Create Bob's voice notebook

# Run by hand only. Copies kaggle/voice to Kaggle as the private notebook joshstutting/bobs-voice.
# The saved run it starts exits right away (the notebook only works in the editor), so it costs no real GPU time.
on:
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q kaggle
      - env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: kaggle kernels push -p kaggle/voice
