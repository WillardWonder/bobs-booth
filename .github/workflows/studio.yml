name: Bob's studio

# Every 15 minutes (off the top of the hour, when GitHub is busiest): start Bob's studio on Kaggle about an hour
# before a Brewers World Series game, and after a game save its replay to replays/ so it plays from this site.
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
    # extra tries in the hours before a 7 PM Central first pitch (GitHub sometimes skips scheduled runs);
    # the reliable trigger is an outside scheduler calling this workflow (see README in kaggle/)
    - cron: "3,13,28,43,58 21,22,23 * * *"
  workflow_dispatch:
    inputs:
      action:
        description: "auto, start, collect, test, render (or render:1,2), status"
        default: auto

permissions:
  contents: write

concurrency:
  group: studio
  cancel-in-progress: false

jobs:
  studio:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q kaggle
      - id: run
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python kaggle/scheduler.py "${{ github.event.inputs.action || 'auto' }}"
      - name: Commit new replays
        if: steps.run.outputs.added != ''
        run: |
          git config user.name "Bob's studio"
          git config user.email "actions@users.noreply.github.com"
          git add replays
          git commit -m "Add Bob's replay of Game ${{ steps.run.outputs.added }}"
          git push
